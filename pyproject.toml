[project]
name = "contextcompass"
dynamic = ["version"]
description = "Durable, file-backed execution state for coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
keywords = ["agents", "llm", "context", "tickets", "handoff", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]

# The payload is Markdown and stdlib-only Python. An agent that has to install
# something before it can read a document is an agent that cannot read the
# document on a fresh clone.
dependencies = []

[project.urls]
Homepage = "https://github.com/Synaptic724/context_compass"
Repository = "https://github.com/Synaptic724/context_compass"

[project.scripts]
contextcompass = "contextcompass_cli.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One source of truth for the version. `src/context_compass/MANIFEST.md` records
# the same number and a test asserts they agree; a version maintained in two
# places is a version that will disagree.
[tool.hatch.version]
path = "src/contextcompass_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/contextcompass_cli"]

# The ~440 payload files ARE the product. Without this the wheel ships the
# tooling and none of the Markdown it operates on - which is exactly what the
# implicit setuptools build produced: 28 .py files, 0 .md.
#
# Mapped rather than moved. Three names, none interchangeable: the DISTRIBUTION
# is `contextcompass`, the MODULE is `contextcompass_cli`, and the DIRECTORY
# created in a consuming repo is `context_compass`. The module name is kept
# distinct from both so no import can resolve two ways.
[tool.hatch.build.targets.wheel.force-include]
"src/context_compass" = "contextcompass_cli/_package"

[tool.hatch.build.targets.sdist]
# Exact roots prevent generic README/LICENSE patterns from including local copies.
only-include = [
    "src/context_compass", "src/contextcompass_cli", "tests", "contributor",
    "AGENTS.md", "README.md", "LICENSE", "NOTICE", "pyproject.toml",
    ".github/workflows/python-publish.yml",
]
exclude = ["**/.codex/**", "**/.agents/**", "**/__pycache__/**", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers --tb=short"
markers = [
    "unit: pure functions, no filesystem beyond tmp_path",
    "integration: runs a tool end to end as a subprocess",
    "regression: locks in a bug that actually happened",
    "packaging: builds a wheel or exercises the installed CLI",
]
